# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "GuardRail Security"
slug: "guardrail"

runtime: python

build:
  install: "pip install -r requirements.txt && pip install -e ."

start:
  type: stdio
  command: "python"
  args:
    - "-m"
    - "guardrail"
    - "serve"
    - "--mode"
    - "stdio"
