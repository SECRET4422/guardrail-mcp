apiVersion: v1
kind: Namespace
metadata:
  name: guardrail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrail-config
  namespace: guardrail
data:
  enterprise.json: |
    {
      "enabled": true,
      "require_auth": true,
      "allow_local_unauthenticated": false,
      "audit_stdout": true,
      "metrics_enabled": true,
      "rate_limit_enabled": true,
      "global_allowed_roots": ["/repos"],
      "tenants": {
        "default": {
          "name": "Default",
          "tier": "enterprise",
          "api_keys": ["REPLACE_VIA_SECRET"],
          "roles": {"REPLACE_VIA_SECRET": "scanner"},
          "policy_pack": "strict",
          "allowed_roots": ["/repos"],
          "requests_per_minute": 120,
          "monthly_scan_quota": 500000,
          "enabled": true
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: guardrail-secrets
  namespace: guardrail
type: Opaque
stringData:
  GUARDRAIL_JWT_SECRET: "replace-with-long-random"
  GUARDRAIL_ADMIN_API_KEY: "replace-admin-key"
  GUARDRAIL_DEMO_API_KEY: "replace-tenant-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-mcp
  namespace: guardrail
  labels:
    app: guardrail-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guardrail-mcp
  template:
    metadata:
      labels:
        app: guardrail-mcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guardrail
          image: guardrail-mcp:enterprise
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: GUARDRAIL_ENTERPRISE
              value: "1"
            - name: GUARDRAIL_ENTERPRISE_CONFIG
              value: /etc/guardrail/enterprise.json
            - name: GUARDRAIL_REQUIRE_AUTH
              value: "true"
            - name: GUARDRAIL_HOST
              value: "0.0.0.0"
            - name: GUARDRAIL_PORT
              value: "8787"
            - name: GUARDRAIL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: guardrail-secrets
                  key: GUARDRAIL_JWT_SECRET
            - name: GUARDRAIL_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrail-secrets
                  key: GUARDRAIL_ADMIN_API_KEY
            - name: GUARDRAIL_ALLOWED_ROOTS
              value: /repos
          volumeMounts:
            - name: config
              mountPath: /etc/guardrail
              readOnly: true
            - name: repos
              mountPath: /repos
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: guardrail-config
        - name: repos
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-mcp
  namespace: guardrail
spec:
  selector:
    app: guardrail-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardrail-ingress
  namespace: guardrail
spec:
  podSelector:
    matchLabels:
      app: guardrail-mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8787
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
    # OSV / package metadata (optional — tighten in air-gapped)
    - ports:
        - protocol: TCP
          port: 443
