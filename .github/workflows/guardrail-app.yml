name: GuardRail PR Gate (rich CI)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  security:
    name: GuardRail hybrid scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install tree-sitter tree-sitter-python tree-sitter-javascript tree-sitter-go tree-sitter-java tree-sitter-c tree-sitter-cpp tree-sitter-rust || true
          echo "PYTHONPATH=${{ github.workspace }}" >> "$GITHUB_ENV"

      - name: Unit tests + benchmarks
        run: |
          python -m unittest discover -s tests -v
          python benchmarks/run_benchmarks.py --json benchmarks/out.json || true

      - name: PR incremental diff scan
        if: github.event_name == 'pull_request'
        id: diff
        run: |
          python -m guardrail scan-diff . \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --sarif guardrail.sarif \
            --json-out guardrail-report.json \
            --fixes || STATUS=$?
          echo "exit=${STATUS:-0}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          p="guardrail-report.json"
          if os.path.exists(p):
              d=json.load(open(p))
              issues=d.get("issue_count") or len(d.get("issues") or [])
              verdict=d.get("security_verdict")
              print(f"issues={issues}")
              print(f"verdict={verdict}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"issues={issues}\n")
                  fh.write(f"verdict={verdict}\n")
          PY

      - name: Full repo scan
        if: github.event_name != 'pull_request'
        run: |
          python -m guardrail scan-repo . --sarif guardrail.sarif --json-out guardrail-report.json --deps --fixes || true

      - name: SBOM
        run: python -m guardrail sbom . --format both --out sbom.json || true

      - name: PR comment summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## GuardRail Security\n';
            try {
              const report = JSON.parse(fs.readFileSync('guardrail-report.json','utf8'));
              const issues = report.issue_count ?? (report.issues||[]).length;
              body += `**Verdict:** ${report.security_verdict || 'n/a'}\n\n`;
              body += `**Issues:** ${issues}\n\n`;
              body += `**Risk score:** ${report.aggregate_risk_score ?? report.risk_score ?? 'n/a'}\n\n`;
              const top = (report.issues||[]).slice(0,10);
              if (top.length) {
                body += '| Rule | Sev | File | Line |\n|---|---|---|---|\n';
                for (const i of top) {
                  body += `| ${i.rule_id||''} | ${i.severity||''} | ${i.path||''} | ${i.line||''} |\n`;
                }
              }
            } catch (e) {
              body += `_Report unavailable: ${e.message}_`;
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: guardrail.sarif

      - uses: actions/upload-artifact@v4
        with:
          name: guardrail-artifacts
          path: |
            guardrail.sarif
            guardrail-report.json
            sbom.json
            benchmarks/out.json
