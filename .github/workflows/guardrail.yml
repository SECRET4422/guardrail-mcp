name: GuardRail Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GuardRail
        run: |
          python -m pip install --upgrade pip
          # If this workflow lives inside the guardrail-mcp repo:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          export PYTHONPATH="${{ github.workspace }}:${PYTHONPATH}"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"

      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m guardrail scan-diff \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD" \
            --sarif guardrail.sarif \
            --json-out guardrail-report.json \
            --fixes || true

      - name: Scan repository
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m guardrail scan-repo . \
            --sarif guardrail.sarif \
            --json-out guardrail-report.json \
            --deps \
            --fixes || true

      - name: Generate SBOM
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m guardrail sbom . --format both --out sbom.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: guardrail.sarif

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-reports
          path: |
            guardrail.sarif
            guardrail-report.json
            sbom.json
