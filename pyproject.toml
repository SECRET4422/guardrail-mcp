[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-mcp"
version = "2.1.0"
description = "Enterprise security MCP: advanced taint, tree-sitter, plugins, IDE, dashboard, CI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.0.0",
]

[project.scripts]
guardrail-mcp = "guardrail.server:main"

[tool.setuptools.packages.find]
include = ["guardrail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
